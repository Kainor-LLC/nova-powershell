name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Tree-sitter CLI
        run: npm install -g tree-sitter-cli@0.27.1

      - name: Grammar tests
        working-directory: grammar/tree-sitter-powershell
        run: tree-sitter test

      - name: Parser is generated for Tree-sitter ABI 14 (older Nova releases)
        run: grep -q '#define LANGUAGE_VERSION 14' grammar/tree-sitter-powershell/src/parser.c

      - name: Nova queries compile against the grammar
        run: |
          for query in PowerShell.novaextension/Queries/*.scm; do
            echo "Checking $query"
            tree-sitter query -p grammar/tree-sitter-powershell "$query" tools/samples/sample.ps1 > /dev/null
          done

      - name: Sample scripts parse without errors
        run: |
          for script in tools/samples/*.ps1; do
            echo "Parsing $script"
            tree-sitter parse -p grammar/tree-sitter-powershell -q "$script"
          done

      - name: Extension JavaScript and manifest are valid
        run: |
          for script in PowerShell.novaextension/Scripts/*.js; do
            node --check "$script"
          done
          node -e 'JSON.parse(require("fs").readFileSync("PowerShell.novaextension/extension.json", "utf8"))'
          sh -n PowerShell.novaextension/Support/pses-bridge.sh
